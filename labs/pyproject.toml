[project]
name = "ae-206-labs"
version = "2027.1.0"
description = "Lab notebooks for the SDAIA Academy course AE-206 Machine Learning Systems on One Machine"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "pillow>=11.0",
    "matplotlib>=3.9",
    "psutil>=6.0",
    "torch>=2.6",
    "onnx>=1.17",
    "onnxscript>=0.3",
    "onnxruntime>=1.21",
    "jupyterlab>=4.4",
    "ipykernel>=6.29",
    "nbclient>=0.10",
]

[tool.uv]
package = false

# CPU wheels of PyTorch for a laptop: every lab runs without a graphics processor
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
