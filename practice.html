<section>
<h2>Day 1: Measure first</h2>
<ol>
<li><p>On a laptop with a ridge point of 3 FLOP per byte, you can halve the FLOPs of one layer. Which layer's time falls most?</p><ul><li><b>A.</b> A matrix product with an intensity of 120 FLOP per byte</li><li><b>B.</b> An elementwise ReLU with an intensity of 0.25 FLOP per byte</li><li><b>C.</b> A layer sitting exactly at the ridge point</li><li><b>D.</b> All three equally, since time is FLOPs over peak</li></ul></li>
<li><p>100 warm calls of Waraqa: mean 6.1 ms, median 5.2 ms, 95th percentile 9.8 ms, first call 140 ms. Ghadeer's budget says "per leaf, in the office". Which number do you compare with it?</p><ul><li><b>A.</b> The mean, 6.1 ms</li><li><b>B.</b> The median, 5.2 ms</li><li><b>C.</b> The 95th percentile, 9.8 ms, with the cold start reported apart</li><li><b>D.</b> The first call, 140 ms</li></ul></li>
<li><p>A step's phases: loading 60%, backward 25%, forward 13%, optimiser 2%. The profiler's largest operator row is convolution_backward. What do you work on first?</p><ul><li><b>A.</b> The backward convolution, the largest profiler row</li><li><b>B.</b> Loading, the largest measured phase</li><li><b>C.</b> The optimiser, by switching to SGD</li><li><b>D.</b> A faster processor for forward and backward</li></ul></li>
<li><p>With four workers, the loading phase drops from 800 ms to almost zero, but the step goes from 2,900 ms to 2,200 ms. What explains it?</p><ul><li><b>A.</b> The workers are not running</li><li><b>B.</b> It is timer noise; the real speed-up is larger</li><li><b>C.</b> Decoding became cheaper, but not by enough</li><li><b>D.</b> The rest of the step was always about 2,100 ms, and the workers take cores from it</li></ul></li>
<li><p>A laptop measures 80 GFLOP/s on a large matrix product and 25 GB/s on a large copy. A layer does 0.5 FLOP per byte moved. Which limit binds it?</p><ul><li><b>A.</b> Memory bandwidth, since 0.5 is far below the ridge point of 3.2</li><li><b>B.</b> Compute, since 80 GFLOP/s is the smaller-looking number</li><li><b>C.</b> Neither: the layer sits exactly on the ridge</li><li><b>D.</b> Memory capacity, since the layer moves bytes</li></ul></li>
<li><p>Phase timers on a training step: loading 300 ms, forward 120 ms, backward 240 ms, optimiser 20 ms. What is the largest speed-up possible by making the backward pass free?</p><ul><li><b>A.</b> About 1.5 times</li><li><b>B.</b> About 3 times</li><li><b>C.</b> About 2 times</li><li><b>D.</b> It cannot be known without a profiler</li></ul></li>
<li><p>Adding four DataLoader workers made the loading phase almost vanish but the step only 20% faster. What should you do next?</p><ul><li><b>A.</b> Add more workers</li><li><b>B.</b> Profile forward and backward: the step is now compute-bound</li><li><b>C.</b> Switch to a faster disk</li><li><b>D.</b> Remove the workers, since the gain is small</li></ul></li>
<li><p>In a framework profiler table, the data loader appears as one row with no detail inside. Which tool shows where its time goes?</p><ul><li><b>A.</b> The same profiler, sorted by total time</li><li><b>B.</b> A roofline estimate</li><li><b>C.</b> A sampling Python profiler such as py-spy, or Scalene</li><li><b>D.</b> A memory profiler</li></ul></li>
<li><p>Caching decoded 64-pixel images made training three times faster. What must be checked before adopting it?</p><ul><li><b>A.</b> Nothing: a faster step is always better</li><li><b>B.</b> That the cache file is compressed</li><li><b>C.</b> That the GPU is busy</li><li><b>D.</b> That the augmentation and image quality did not change what the model learns</li></ul></li>
<li><p>100 timed calls: mean 7 ms, median 5 ms, 95th percentile 14 ms. Which pair describes the latency a user feels?</p><ul><li><b>A.</b> Mean and standard deviation</li><li><b>B.</b> Minimum and maximum</li><li><b>C.</b> Median and 95th percentile</li><li><b>D.</b> Mean and median</li></ul></li>
<li><p>A benchmark's first call takes 120 ms and the next 99 average 5 ms. How should the report treat the first call?</p><ul><li><b>A.</b> Average it with the others</li><li><b>B.</b> Drop it and never mention it</li><li><b>C.</b> Repeat until the first call is fast</li><li><b>D.</b> Report it separately as the cold start, and exclude it from the steady-state percentiles</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Memory and training efficiency</h2>
<ol>
<li><p>Lina says her new loader made training "much faster". She shows one epoch timed before (31 min) and one after (24 min), each run once, on different days. What do you ask for?</p><ul><li><b>A.</b> Nothing: 7 minutes is too large to be noise</li><li><b>B.</b> Phase times of both loaders over the same steps on the same machine, start-up excluded</li><li><b>C.</b> The framework profiler's operator table for the new loader</li><li><b>D.</b> The roofline estimate of the loader</li></ul></li>
<li><p>Waraqa's step peaks at 1,000 MB at batch 256, of which about 10 MB is weights, gradients and optimiser state. Predict the peak at batch 512.</p><ul><li><b>A.</b> About 1,010 MB: only the batch's input grows</li><li><b>B.</b> About 4,000 MB: memory grows with the square of the batch</li><li><b>C.</b> About 3,000 MB: the optimiser state triples</li><li><b>D.</b> About 2,000 MB: the activations double, the fixed part does not</li></ul></li>
<li><p>On a laptop whose processor reports AVX2 only, bfloat16 autocast made Waraqa's training step slower with the same accuracy. What is the best explanation?</p><ul><li><b>A.</b> The model is too small to benefit from any optimisation</li><li><b>B.</b> bfloat16 lost precision, so the step had to do more work</li><li><b>C.</b> The processor has no native bfloat16 arithmetic, so each operation pays for conversions</li><li><b>D.</b> The optimiser now runs in bfloat16 and needs more steps</li></ul></li>
<li><p>A language model of 2 B parameters does not fit for training on a 24 GB GPU even at batch 1. Will activation checkpointing make it fit?</p><ul><li><b>A.</b> Unlikely: weights, gradients and AdamW state already need about 32 GB, which checkpointing does not touch</li><li><b>B.</b> Yes: checkpointing reduces all training memory</li><li><b>C.</b> Not alone, but gradient accumulation will</li><li><b>D.</b> Yes, if the checkpoints are written to disk</li></ul></li>
<li><p>Compiling Waraqa costs 20 s on the first call and saves 2 ms per batch. The field app starts, classifies about 50 leaves, and closes. Should it compile at start-up?</p><ul><li><b>A.</b> Yes: 2 ms per batch is a 20% gain</li><li><b>B.</b> No: 50 leaves save well under a second, and the agent waits 20 s at every start</li><li><b>C.</b> No: compilation lowers accuracy</li><li><b>D.</b> Yes: the gain grows the longer the laptop runs</li></ul></li>
<li><p>A team plans to train a 3 B parameter model in float32 with AdamW on a GPU with 40 GB. Before counting activations, does it fit?</p><ul><li><b>A.</b> Yes: 3 B parameters are 12 GB</li><li><b>B.</b> Yes, with room for a large batch</li><li><b>C.</b> It depends only on the batch size</li><li><b>D.</b> No: weights, gradients and AdamW state need about 48 GB</li></ul></li>
<li><p>A training step peaks at 900 MB at batch 128; weights, gradients and optimiser state are 20 MB. What peak do you predict at batch 32?</p><ul><li><b>A.</b> About 240 MB</li><li><b>B.</b> About 900 MB</li><li><b>C.</b> About 450 MB</li><li><b>D.</b> About 30 MB</li></ul></li>
<li><p>Your estimate of saved activations is 20% below what autograd hooks count. Which omission is the likeliest?</p><ul><li><b>A.</b> The weights</li><li><b>B.</b> Max pooling's indices, stored as 8-byte integers, and the input batch</li><li><b>C.</b> The optimiser state</li><li><b>D.</b> The loss value</li></ul></li>
<li><p>Which part of training memory does activation checkpointing reduce?</p><ul><li><b>A.</b> Weights</li><li><b>B.</b> Gradients</li><li><b>C.</b> Activations kept for the backward pass</li><li><b>D.</b> Optimiser state</li></ul></li>
<li><p>On a processor without native bfloat16 arithmetic, bfloat16 autocast made training slower at equal accuracy. What is the right report?</p><ul><li><b>A.</b> Mixed precision does not work</li><li><b>B.</b> The model is too small</li><li><b>C.</b> Accuracy must have dropped</li><li><b>D.</b> On this processor bfloat16 is emulated, so it costs time; on hardware with native support it can be faster</li></ul></li>
<li><p>A fine-tuning run of a small classifier uses float16 autocast on a GPU. The loss is finite and the same as in float32, no gradient is infinite or NaN, and the float32 run of the same batch has no zero gradients. In float16, 7% of the embedding gradients and 2% of all gradients are exactly zero. What should the team change?</p><ul><li><b>A.</b> Lower the learning rate, since gradients this large make float16 training unstable</li><li><b>B.</b> Keep the weights and the optimiser state in float16 as well</li><li><b>C.</b> Raise the learning rate so that the small updates show again</li><li><b>D.</b> Scale the loss before backward and unscale the gradients before the step</li></ul></li>
<li><p>With gradient accumulation over 4 micro-batches and plain SGD, a participant forgets to divide each loss by 4. What happens?</p><ul><li><b>A.</b> Each update is four times too large, as if the learning rate were four times higher</li><li><b>B.</b> Nothing: the optimiser normalises</li><li><b>C.</b> The gradients cancel out</li><li><b>D.</b> Memory use quadruples</li></ul></li>
<li><p>Compiling a model costs 15 s on the first call and saves 1.5 ms per call. After how many calls in one process is the cost repaid?</p><ul><li><b>A.</b> About 100</li><li><b>B.</b> About 1,000</li><li><b>C.</b> About 10,000</li><li><b>D.</b> Never</li></ul></li>
<li><p>Why can batch norm be folded into the preceding convolution at inference but not during training?</p><ul><li><b>A.</b> Folding only works on GPUs</li><li><b>B.</b> At inference it uses fixed stored statistics, so it is a constant affine map</li><li><b>C.</b> Training needs the extra memory</li><li><b>D.</b> Batch norm has no weights at inference</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Inference and compression</h2>
<ol>
<li><p>Waraqa's training peak at batch 256 is about 40 times its weights, gradients and optimiser state together. Which change cuts that peak most, at the same effective batch?</p><ul><li><b>A.</b> Switching AdamW for SGD to drop the optimiser state</li><li><b>B.</b> Accumulating four micro-batches of 64</li><li><b>C.</b> Storing the weights in 16 bits</li><li><b>D.</b> Folding batch norm into the convolutions</li></ul></li>
<li><p>Waraqa serves more leaves per second at batch 16 than at batch 1 (Lab 3.1). In the office, an agent sends one leaf about every two seconds. Which batch size should the office app use?</p><ul><li><b>A.</b> 16, for the throughput</li><li><b>B.</b> 4, a compromise</li><li><b>C.</b> 1: requests are rare, so any larger batch adds seconds of waiting</li><li><b>D.</b> 64, the cheapest per leaf</li></ul></li>
<li><p>Farm agents start pasting a week of farm notes (2,000 characters) before each question. On a model with a context of 4,096 tokens, what changes most?</p><ul><li><b>A.</b> The memory of the model's weights</li><li><b>B.</b> Tokens per second, which fall in proportion to the context</li><li><b>C.</b> The number of tokens in the answer</li><li><b>D.</b> The time to first token and the size of the key-value cache</li></ul></li>
<li><p>Another team's 8-bit leaf classifier is a quarter of the size, 30% faster, and 0.6 points less accurate overall. Date palm leaves, one in ten of their held-out set, lost 3 points. What do you do next?</p><ul><li><b>A.</b> Put intervals on the overall and per-crop differences, and compare them with the floor per crop</li><li><b>B.</b> Ship it: 0.6 points is within a 1-point floor</li><li><b>C.</b> Reject it: any crop that loses is unacceptable</li><li><b>D.</b> Recalibrate with twice as many leaves and ship that</li></ul></li>
<li><p>You set half of Waraqa's convolution weights to zero by magnitude. Accuracy barely changes and latency does not change at all. Why?</p><ul><li><b>A.</b> The pruning did not take effect</li><li><b>B.</b> The dense kernels still multiply every weight, zero or not</li><li><b>C.</b> Batch norm undoes the pruning at inference</li><li><b>D.</b> Only the classifier head determines latency</li></ul></li>
<li><p>A language model decodes one token at a time for one user. Each step reads all 2 GB of weights and does about 4 GFLOP. On a machine with 50 GB/s and 500 GFLOP/s, what is the lower bound on time per token?</p><ul><li><b>A.</b> About 8 ms, set by compute</li><li><b>B.</b> About 40 ms, set by reading the weights</li><li><b>C.</b> About 4 ms, the average of the two</li><li><b>D.</b> About 0.4 ms, set by the cache</li></ul></li>
<li><p>Why does serving 16 leaves in one batch raise a fully connected layer's arithmetic intensity compared with one leaf?</p><ul><li><b>A.</b> The layer does fewer FLOPs per leaf in a batch</li><li><b>B.</b> Batching compresses the activations</li><li><b>C.</b> The weights are read once and used for 16 rows instead of one</li><li><b>D.</b> The processor runs at a higher clock speed for batches</li></ul></li>
<li><p>A model has 24 layers, 8 key-value heads of 128 numbers, and stores its cache in 16 bits. How large is the key-value cache for 2,048 tokens?</p><ul><li><b>A.</b> About 50 MB</li><li><b>B.</b> About 200 MB</li><li><b>C.</b> About 400 MB</li><li><b>D.</b> About 800 MB</li></ul></li>
<li><p>Which change makes a convolutional network faster on a standard dense runtime?</p><ul><li><b>A.</b> Zeroing half of the weights by magnitude</li><li><b>B.</b> Storing weights as float64</li><li><b>C.</b> Removing half of the filters of each convolution</li><li><b>D.</b> Adding dropout</li></ul></li>
<li><p>A static 8-bit model loses 6 points on date palm and almost nothing on tomato. The calibration set was 256 tomato leaves. What is the likeliest cause?</p><ul><li><b>A.</b> 8 bits are too few for any classifier</li><li><b>B.</b> The model was exported in training mode</li><li><b>C.</b> Date palm leaves are larger</li><li><b>D.</b> Activation ranges learnt from tomato leaves do not fit date-palm leaves</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Export and benchmark</h2>
<ol>
<li><p>Hasad's 4-bit file is about a sixth of the 32-bit file's size. Loaded with "expand once", it decodes no faster than the 32-bit model once the machine is quiet. Why?</p><ul><li><b>A.</b> The 4-bit file holds the same bytes as the 32-bit one</li><li><b>B.</b> At load the weights became float32 again, so each decode step reads as many bytes as before</li><li><b>C.</b> The key-value cache got larger in 4 bits</li><li><b>D.</b> The tokenizer is slower for quantised models</li></ul></li>
<li><p>The exported Waraqa gives different classes from PyTorch on field photos. Feeding both the identical input tensor, their logits agree within 1e-6. Where is the fault?</p><ul><li><b>A.</b> In the exported file: re-export with another opset</li><li><b>B.</b> In the preprocessing: the two pipelines build different tensors from the same photo</li><li><b>C.</b> In floating-point rounding inside the runtime</li><li><b>D.</b> In the model's training, which must be redone</li></ul></li>
<li><p>The 8-bit median is 3% lower than the 32-bit median, and the two 95% intervals overlap by most of their width. What is the honest report?</p><ul><li><b>A.</b> On this machine at batch 1 the two are not distinguishable; the 8-bit file is smaller</li><li><b>B.</b> The 8-bit model is 3% faster</li><li><b>C.</b> The two models are exactly as fast</li><li><b>D.</b> Repeat until the intervals separate, then report the difference</li></ul></li>
<li><p>A variant loses 0.4 points overall, interval [-1.3, +0.5], and 1.0 point on date palm, interval [-4.0, +2.0]. The floor is 1 point overall and 2 per crop. What is the verdict?</p><ul><li><b>A.</b> Accept: both losses are within the floor</li><li><b>B.</b> Reject: the intervals go below the floor</li><li><b>C.</b> Uncertain: the estimates pass but both intervals reach below the floor</li><li><b>D.</b> Accept overall; per-crop intervals do not matter</li></ul></li>
<li><p>Variant A is the fastest but fails the quality floor on date palm. Variant B meets every line, with a p95 of 14.9 ms against a 15 ms budget, measured on the course laptop. What do you recommend?</p><ul><li><b>A.</b> A, because speed matters most in the field</li><li><b>B.</b> B, with no further condition</li><li><b>C.</b> Neither: keep the 32-bit model until something is faster</li><li><b>D.</b> B, with its margin stated and a re-run on a farm-office laptop before it ships</li></ul></li>
<li><p>After export, the runtime's logits differ from PyTorch's by up to 3e-6 on 500 leaves, with the same class everywhere. The tolerance stated in advance is 1e-4. What do you conclude?</p><ul><li><b>A.</b> Parity holds: the differences are rounding from fused and reordered operations</li><li><b>B.</b> The export is wrong: outputs must be identical</li><li><b>C.</b> The runtime uses a different model</li><li><b>D.</b> Run it on one more leaf to be sure</li></ul></li>
<li><p>Two models are compared on the same 2,000 leaves. Why use a paired comparison rather than two separate accuracy intervals?</p><ul><li><b>A.</b> It needs fewer leaves to label</li><li><b>B.</b> Each leaf's difficulty cancels out, so the difference is measured more precisely</li><li><b>C.</b> It always shows the new model is better</li><li><b>D.</b> It ignores the leaves both models get right</li></ul></li>
<li><p>Your neighbour re-runs your benchmark and gets a median 30% higher. Which is the most useful first check?</p><ul><li><b>A.</b> Whether their laptop was on battery or under load, and the thread count</li><li><b>B.</b> Whether your code has a bug</li><li><b>C.</b> Whether 30% is within the bootstrap interval</li><li><b>D.</b> Whether they used a newer Python</li></ul></li>
<li><p>Why does the course's benchmark cycle through a saved file of 40 leaves in fixed crop shares?</p><ul><li><b>A.</b> To make the benchmark slower</li><li><b>B.</b> So a re-run sees the same inputs, and the inputs resemble the field</li><li><b>C.</b> Because ONNX Runtime needs exactly 40 inputs</li><li><b>D.</b> To test accuracy at the same time</li></ul></li>
<li><p>Budget: p95 at most 15 ms, file at most 1 MB, quality within 1 point. Variant A: 9 ms, 0.3 MB, -2.5 points. Variant B: 13 ms, 0.4 MB, -0.4 points. Variant C: 8 ms, 1.2 MB, -0.1 points. Which meets the budget?</p><ul><li><b>A.</b> A</li><li><b>B.</b> B</li><li><b>C.</b> C</li><li><b>D.</b> None</li></ul></li>
<li><p>An optimisation log lists: quantisation (-30% p95), batch norm folding (-3%), thread pinning (no effect), input resizing (-55%). How should it be ordered in the report?</p><ul><li><b>A.</b> In the order the changes were tried</li><li><b>B.</b> Alphabetically</li><li><b>C.</b> Input resizing, quantisation, folding, thread pinning</li><li><b>D.</b> Without thread pinning, since it did nothing</li></ul></li>
<li><p>A participant reports '0.04 Wh per 1,000 predictions' with no further detail. What is missing?</p><ul><li><b>A.</b> Nothing: it is a measurement</li><li><b>B.</b> The model's accuracy</li><li><b>C.</b> The number of parameters</li><li><b>D.</b> The assumed power draw and the timing it was computed from</li></ul></li>
<li><p>A variant meets the 15 ms p95 budget at 14.8 ms on the course laptop. What belongs in the recommendation?</p><ul><li><b>A.</b> The margin, and a re-run on a target farm-office laptop before shipping</li><li><b>B.</b> Ship it: it meets the budget</li><li><b>C.</b> Reject it: the margin is too small</li><li><b>D.</b> Lower the budget to 14 ms</li></ul></li>
</ol>

LOP per byte"},{"key":"C","text":"A layer sitting exactly at the ridge point"},{"key":"D","text":"All three equally, since time is FLOPs over peak"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Only a compute-bound layer, far above the ridge, spends its time on arithmetic; halving its FLOPs nearly halves its time.","misconceptions":["","Thinks fewer FLOPs always help: this layer waits for memory, so its time hardly moves","Confuses the ridge point with the best place to be: at the ridge both roofs bind, so halving FLOPs leaves the memory roof","Assumes time is FLOPs divided by peak for every layer, ignoring the bandwidth roof"],"lo":["LO1"],"day":1,"session":1,"slide":{"deck":"day1","id":"checkpoint-1","title":"Which layer gets faster with fewer FLOPs?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"100 warm calls of Waraqa: mean 6.1 ms, median 5.2 ms, 95th percentile 9.8 ms, first call 140 ms. Ghadeer's budget says \"per leaf, in the office\". Which number do you compare with it?","options":[{"key":"A","text":"The mean, 6.1 ms"},{"key":"B","text":"The median, 5.2 ms"},{"key":"C","text":"The 95th percentile, 9.8 ms, with the cold start reported apart"},{"key":"D","text":"The first call, 140 ms"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A budget on a tail percentile protects the slow calls users feel; the cold start is a separate line because it is paid once.","misconceptions":["Uses the mean, which a few slow calls pull up and which hides how often a farmer waits long","Uses the typical call and ignores the slow one in twenty that the farmer actually notices","","Mixes a one-time event into a per-leaf budget; the first call is paid once per session"],"lo":["LO6"],"day":1,"session":2,"slide":{"deck":"day1","id":"checkpoint-2","title":"Which number goes in the budget?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"A step's phases: loading 60%, backward 25%, forward 13%, optimiser 2%. The profiler's largest operator row is convolution_backward. What do you work on first?","options":[{"key":"A","text":"The backward convolution, the largest profiler row"},{"key":"B","text":"Loading, the largest measured phase"},{"key":"C","text":"The optimiser, by switching to SGD"},{"key":"D","text":"A faster processor for forward and backward"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The largest phase sets the ceiling: fixing loading can make the step up to 2.5 times faster, fixing backward at most 1.3 times.","misconceptions":["Reads the largest operator row as the largest phase; loading is spread over Python code the table does not break down","","Optimises the cheapest phase: even removing it entirely saves 2%","Changes the compute roof while the step waits for data; forward and backward are 38%"],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"checkpoint-3","title":"What do you fix first?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"With four workers, the loading phase drops from 800 ms to almost zero, but the step goes from 2,900 ms to 2,200 ms. What explains it?","options":[{"key":"A","text":"The workers are not running"},{"key":"B","text":"It is timer noise; the real speed-up is larger"},{"key":"C","text":"Decoding became cheaper, but not by enough"},{"key":"D","text":"The rest of the step was always about 2,100 ms, and the workers take cores from it"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Hiding loading removes at most its share; what remains is compute, now competing with the workers for cores.","misconceptions":["Assumes the workers failed; the loading phase did drop","Blames measurement noise for a 25% change seen on every step","Thinks decoding got cheaper; workers move the work to other cores, they do not reduce it",""],"lo":["LO2"],"day":1,"session":4,"slide":{"deck":"day1","id":"checkpoint-4","title":"Loading vanished. Why is the step only a little faster?"},"level":null,"pool":"checkpoint"},{"id":"review-day-1-q1","type":"single","prompt":"Lina says her new loader made training \"much faster\". She shows one epoch timed before (31 min) and one after (24 min), each run once, on different days. What do you ask for?","options":[{"key":"A","text":"Nothing: 7 minutes is too large to be noise"},{"key":"B","text":"Phase times of both loaders over the same steps on the same machine, start-up excluded"},{"key":"C","text":"The framework profiler's operator table for the new loader"},{"key":"D","text":"The roofline estimate of the loader"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A before-and-after claim needs both sides measured the same way: same steps, same machine, start-up excluded, per phase so the change is explained.","misconceptions":["Accepts one run per side, which cannot separate the change from the day's load and the cold start","","Asks for an operator table, which does not show the Python loader's work at all","Trusts a theoretical figure where a measurement is cheap and decisive"],"lo":["LO2"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day-1","title":"Which measurement settles it?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-1-q1","type":"single","prompt":"Waraqa's step peaks at 1,000 MB at batch 256, of which about 10 MB is weights, gradients and optimiser state. Predict the peak at batch 512.","options":[{"key":"A","text":"About 1,010 MB: only the batch's input grows"},{"key":"B","text":"About 4,000 MB: memory grows with the square of the batch"},{"key":"C","text":"About 3,000 MB: the optimiser state triples"},{"key":"D","text":"About 2,000 MB: the activations double, the fixed part does not"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Activations are per leaf, so they scale linearly with the batch; parameters, gradients and optimiser state do not depend on it.","misconceptions":["Thinks the fixed part dominates; here it is 1% of the total","Doubles twice, as if memory grew with the square of the batch","Believes the optimiser state scales with the batch; it scales with the parameters",""],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"checkpoint-1","title":"What happens at batch 512?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"On a laptop whose processor reports AVX2 only, bfloat16 autocast made Waraqa's training step slower with the same accuracy. What is the best explanation?","options":[{"key":"A","text":"The model is too small to benefit from any optimisation"},{"key":"B","text":"bfloat16 lost precision, so the step had to do more work"},{"key":"C","text":"The processor has no native bfloat16 arithmetic, so each operation pays for conversions"},{"key":"D","text":"The optimiser now runs in bfloat16 and needs more steps"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Without native support the lower precision is emulated: numbers are converted to float32 to compute and back, which adds work instead of saving it.","misconceptions":["Blames the model's size; the cost comes from converting formats, whatever the size","Confuses precision with correctness; accuracy was the same","","Thinks autocast also changes the optimiser; the weights stay in float32"],"lo":["LO4"],"day":2,"session":2,"slide":{"deck":"day2","id":"checkpoint-2","title":"Why did bfloat16 not help here?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"A language model of 2 B parameters does not fit for training on a 24 GB GPU even at batch 1. Will activation checkpointing make it fit?","options":[{"key":"A","text":"Unlikely: weights, gradients and AdamW state already need about 32 GB, which checkpointing does not touch"},{"key":"B","text":"Yes: checkpointing reduces all training memory"},{"key":"C","text":"Not alone, but gradient accumulation will"},{"key":"D","text":"Yes, if the checkpoints are written to disk"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Checkpointing and accumulation both cut activation memory only; the 16 bytes per parameter of float32 AdamW stay.","misconceptions":["","Thinks checkpointing reduces every part of memory; it only touches activations","Thinks accumulation reduces weights or optimiser state; it only splits the batch","Confuses checkpointing activations with saving the model to disk"],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"checkpoint-3","title":"What does activation checkpointing reduce?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"Compiling Waraqa costs 20 s on the first call and saves 2 ms per batch. The field app starts, classifies about 50 leaves, and closes. Should it compile at start-up?","options":[{"key":"A","text":"Yes: 2 ms per batch is a 20% gain"},{"key":"B","text":"No: 50 leaves save well under a second, and the agent waits 20 s at every start"},{"key":"C","text":"No: compilation lowers accuracy"},{"key":"D","text":"Yes: the gain grows the longer the laptop runs"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The first call is repaid only after about 10,000 batches in one process; a short-lived app never gets there. A long-running service, or a cached compiled artefact, does.","misconceptions":["Looks at the per-call gain alone and ignores who pays the first call","","Thinks compilation changes the model's accuracy; fused code computes the same function","Assumes the gain grows with time; it is per call and the app makes few calls"],"lo":["LO4"],"day":2,"session":4,"slide":{"deck":"day2","id":"checkpoint-4","title":"Is compilation worth it here?"},"level":null,"pool":"checkpoint"},{"id":"review-day-2-q1","type":"single","prompt":"Waraqa's training peak at batch 256 is about 40 times its weights, gradients and optimiser state together. Which change cuts that peak most, at the same effective batch?","options":[{"key":"A","text":"Switching AdamW for SGD to drop the optimiser state"},{"key":"B","text":"Accumulating four micro-batches of 64"},{"key":"C","text":"Storing the weights in 16 bits"},{"key":"D","text":"Folding batch norm into the convolutions"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Activations dominate and scale with the batch held at once; accumulation holds a quarter of them.","misconceptions":["Optimiser state is a few megabytes here; activations are the bulk","","Fewer weight bytes do not touch the activations that dominate","Folding is an inference transformation; it does not apply while batch norm is training"],"lo":["LO3"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day-2","title":"Where did the memory go?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-1-q1","type":"single","prompt":"Waraqa serves more leaves per second at batch 16 than at batch 1 (Lab 3.1). In the office, an agent sends one leaf about every two seconds. Which batch size should the office app use?","options":[{"key":"A","text":"16, for the throughput"},{"key":"B","text":"4, a compromise"},{"key":"C","text":"1: requests are rare, so any larger batch adds seconds of waiting"},{"key":"D","text":"64, the cheapest per leaf"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"At one leaf every two seconds, a batch of b makes leaves wait for b - 1 arrivals; only batch 1 meets a budget in milliseconds.","misconceptions":["Optimises throughput, which the office does not need; the first leaf would wait for fifteen more","Splits the difference without measuring the wait; a batch of 4 still waits for three more leaves","","Thinks the largest batch is always cheapest per leaf and therefore best"],"lo":["LO4"],"day":3,"session":1,"slide":{"deck":"day3","id":"checkpoint-1","title":"Which batch size for the office?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"Farm agents start pasting a week of farm notes (2,000 characters) before each question. On a model with a context of 4,096 tokens, what changes most?","options":[{"key":"A","text":"The memory of the model's weights"},{"key":"B","text":"Tokens per second, which fall in proportion to the context"},{"key":"C","text":"The number of tokens in the answer"},{"key":"D","text":"The time to first token and the size of the key-value cache"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Prefill processes every prompt token and the cache stores each one; decoding adds one token at a time.","misconceptions":["Thinks the weights grow with the prompt; they are fixed","Expects decoding to slow in proportion; each decode step adds one token and reads the cache, which grows only modestly","Thinks a longer prompt makes the answer longer; answer length depends on the question",""],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"checkpoint-2","title":"What grows with the context?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"Another team's 8-bit leaf classifier is a quarter of the size, 30% faster, and 0.6 points less accurate overall. Date palm leaves, one in ten of their held-out set, lost 3 points. What do you do next?","options":[{"key":"A","text":"Put intervals on the overall and per-crop differences, and compare them with the floor per crop"},{"key":"B","text":"Ship it: 0.6 points is within a 1-point floor"},{"key":"C","text":"Reject it: any crop that loses is unacceptable"},{"key":"D","text":"Recalibrate with twice as many leaves and ship that"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Compression changes errors unevenly; a per-group loss on a small group needs an interval before a decision. That is Lab 4.3.","misconceptions":["","Accepts on the overall number and ignores the group that lost most","Rejects on a point estimate from about 200 leaves without asking how uncertain it is","Assumes more calibration data always fixes a group's loss, before measuring whether the loss is real"],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"checkpoint-3","title":"Is the 8-bit file ready to ship?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"You set half of Waraqa's convolution weights to zero by magnitude. Accuracy barely changes and latency does not change at all. Why?","options":[{"key":"A","text":"The pruning did not take effect"},{"key":"B","text":"The dense kernels still multiply every weight, zero or not"},{"key":"C","text":"Batch norm undoes the pruning at inference"},{"key":"D","text":"Only the classifier head determines latency"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Unstructured zeros keep every matrix the same size; only removing whole channels, or a sparse kernel, reduces work.","misconceptions":["Thinks the zeros were not applied; counting them would show they were","","Blames batch norm, which is unaffected by weight masking","Assumes latency is dominated by the head; the convolutions do almost all the work"],"lo":["LO5"],"day":3,"session":4,"slide":{"deck":"day3","id":"checkpoint-4","title":"Why is the masked model not faster?"},"level":null,"pool":"checkpoint"},{"id":"review-day-3-q1","type":"single","prompt":"Hasad's 4-bit file is about a sixth of the 32-bit file's size. Loaded with \"expand once\", it decodes no faster than the 32-bit model once the machine is quiet. Why?","options":[{"key":"A","text":"The 4-bit file holds the same bytes as the 32-bit one"},{"key":"B","text":"At load the weights became float32 again, so each decode step reads as many bytes as before"},{"key":"C","text":"The key-value cache got larger in 4 bits"},{"key":"D","text":"The tokenizer is slower for quantised models"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Decoding at batch 1 is memory-bound; speed comes from reading fewer bytes per token, which needs kernels that compute on the 4-bit blocks.","misconceptions":["Thinks the file did not shrink; the size was measured","","Blames the cache, which is the same size in both runs","Thinks the tokenizer depends on the precision; it does not change"],"lo":["LO5"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day-3","title":"Why was the 4-bit file not faster?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-1-q1","type":"single","prompt":"The exported Waraqa gives different classes from PyTorch on field photos. Feeding both the identical input tensor, their logits agree within 1e-6. Where is the fault?","options":[{"key":"A","text":"In the exported file: re-export with another opset"},{"key":"B","text":"In the preprocessing: the two pipelines build different tensors from the same photo"},{"key":"C","text":"In floating-point rounding inside the runtime"},{"key":"D","text":"In the model's training, which must be redone"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Identical inputs, identical outputs: the model half is proven, so the difference is in how each side turns a photo into a tensor.","misconceptions":["Ignores the test just run: identical inputs gave identical outputs, so the file is right","","Blames rounding, which the 1e-6 agreement rules out as the cause of different classes","Confuses a runtime fault with a training problem; the PyTorch model is the reference here"],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"checkpoint-1","title":"Where do you look first?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-2-q1","type":"single","prompt":"The 8-bit median is 3% lower than the 32-bit median, and the two 95% intervals overlap by most of their width. What is the honest report?","options":[{"key":"A","text":"On this machine at batch 1 the two are not distinguishable; the 8-bit file is smaller"},{"key":"B","text":"The 8-bit model is 3% faster"},{"key":"C","text":"The two models are exactly as fast"},{"key":"D","text":"Repeat until the intervals separate, then report the difference"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Overlapping intervals mean the data cannot separate the two; report that, and the differences you can show (size).","misconceptions":["","Reports the point estimates as if they settled the question","Turns overlapping intervals into a claim of equality, which they do not prove","Keeps measuring until a difference appears, which inflates false findings"],"lo":["LO6"],"day":4,"session":2,"slide":{"deck":"day4","id":"checkpoint-2","title":"What do you report?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-3-q1","type":"single","prompt":"A variant loses 0.4 points overall, interval [-1.3, +0.5], and 1.0 point on date palm, interval [-4.0, +2.0]. The floor is 1 point overall and 2 per crop. What is the verdict?","options":[{"key":"A","text":"Accept: both losses are within the floor"},{"key":"B","text":"Reject: the intervals go below the floor"},{"key":"C","text":"Uncertain: the estimates pass but both intervals reach below the floor"},{"key":"D","text":"Accept overall; per-crop intervals do not matter"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The data are consistent with a loss beyond the floor; more evidence is needed before the variant ships.","misconceptions":["Reads only the point estimates, which do pass, and ignores the intervals","Treats an interval reaching below the floor as proof of a loss below it","","Thinks a paired test is needed only overall; groups are where losses hide"],"lo":["LO5"],"day":4,"session":3,"slide":{"deck":"day4","id":"checkpoint-3","title":"Accept, reject or uncertain?"},"level":null,"pool":"checkpoint"},{"id":"checkpoint-4-q1","type":"single","prompt":"Variant A is the fastest but fails the quality floor on date palm. Variant B meets every line, with a p95 of 14.9 ms against a 15 ms budget, measured on the course laptop. What do you recommend?","options":[{"key":"A","text":"A, because speed matters most in the field"},{"key":"B","text":"B, with no further condition"},{"key":"C","text":"Neither: keep the 32-bit model until something is faster"},{"key":"D","text":"B, with its margin stated and a re-run on a farm-office laptop before it ships"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"B meets the budget on the measured machine; a 0.1 ms margin is inside the noise of another laptop, so the target device has the last word.","misconceptions":["Puts speed before a quality floor the company set","Treats a 0.1 ms margin on another machine as settled","Rejects a variant that meets every line because its margin is small",""],"lo":["LO7"],"day":4,"session":4,"slide":{"deck":"day4","id":"checkpoint-4","title":"Which variant do you recommend?"},"level":null,"pool":"checkpoint"},{"id":"q-lo1-ridge","type":"single","prompt":"A laptop measures 80 GFLOP/s on a large matrix product and 25 GB/s on a large copy. A layer does 0.5 FLOP per byte moved. Which limit binds it?","options":[{"key":"A","text":"Memory bandwidth, since 0.5 is far below the ridge point of 3.2"},{"key":"B","text":"Compute, since 80 GFLOP/s is the smaller-looking number"},{"key":"C","text":"Neither: the layer sits exactly on the ridge"},{"key":"D","text":"Memory capacity, since the layer moves bytes"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The ridge point is 80 / 25 = 3.2 FLOP per byte; a layer at 0.5 is below it, so it waits for memory.","misconceptions":["","Compares units that cannot be compared instead of computing the ridge point","Miscomputes the ridge point","Confuses how much fits (capacity) with how fast bytes move (bandwidth)"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo1-batch1","type":"single","prompt":"A language model decodes one token at a time for one user. Each step reads all 2 GB of weights and does about 4 GFLOP. On a machine with 50 GB/s and 500 GFLOP/s, what is the lower bound on time per token?","options":[{"key":"A","text":"About 8 ms, set by compute"},{"key":"B","text":"About 40 ms, set by reading the weights"},{"key":"C","text":"About 4 ms, the average of the two"},{"key":"D","text":"About 0.4 ms, set by the cache"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Reading 2 GB at 50 GB/s takes 40 ms; computing 4 GFLOP at 500 GFLOP/s takes 8 ms. The larger bound wins.","misconceptions":["Takes the compute bound when the memory bound is larger","","Averages two bounds instead of taking the larger","Ignores the weights, which every step must read"],"lo":["LO1"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo1-batching-intensity","type":"single","prompt":"Why does serving 16 leaves in one batch raise a fully connected layer's arithmetic intensity compared with one leaf?","options":[{"key":"A","text":"The layer does fewer FLOPs per leaf in a batch"},{"key":"B","text":"Batching compresses the activations"},{"key":"C","text":"The weights are read once and used for 16 rows instead of one"},{"key":"D","text":"The processor runs at a higher clock speed for batches"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"FLOPs grow with the batch while the weight bytes are read once, so FLOPs per byte rise.","misconceptions":["Thinks batching removes arithmetic; it shares weight reads","Invents a compression step that batching does not do","","Attributes the gain to clock speed instead of data reuse"],"lo":["LO1"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo1-capacity","type":"single","prompt":"A team plans to train a 3 B parameter model in float32 with AdamW on a GPU with 40 GB. Before counting activations, does it fit?","options":[{"key":"A","text":"Yes: 3 B parameters are 12 GB"},{"key":"B","text":"Yes, with room for a large batch"},{"key":"C","text":"It depends only on the batch size"},{"key":"D","text":"No: weights, gradients and AdamW state need about 48 GB"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"16 bytes per parameter for float32 weights, gradients and two AdamW moments: 3 B x 16 = 48 GB.","misconceptions":["Counts the weights only","Ignores gradients and optimiser state","Forgets the fixed part that does not depend on the batch",""],"lo":["LO1"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo2-largest-phase","type":"single","prompt":"Phase timers on a training step: loading 300 ms, forward 120 ms, backward 240 ms, optimiser 20 ms. What is the largest speed-up possible by making the backward pass free?","options":[{"key":"A","text":"About 1.5 times"},{"key":"B","text":"About 3 times"},{"key":"C","text":"About 2 times"},{"key":"D","text":"It cannot be known without a profiler"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The step is 680 ms; without backward it is 440 ms, so at most 680 / 440, about 1.5 times.","misconceptions":["","Divides by the backward share instead of what remains","Assumes backward is half the step","Thinks Amdahl's ceiling needs operator detail; phase times suffice"],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo2-workers","type":"single","prompt":"Adding four DataLoader workers made the loading phase almost vanish but the step only 20% faster. What should you do next?","options":[{"key":"A","text":"Add more workers"},{"key":"B","text":"Profile forward and backward: the step is now compute-bound"},{"key":"C","text":"Switch to a faster disk"},{"key":"D","text":"Remove the workers, since the gain is small"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Once loading hides behind compute, the remaining phases set the step time; they are the next target.","misconceptions":["Keeps fixing a phase that is no longer the bottleneck","","Fixes storage when loading is already hidden","Throws away a measured gain"],"lo":["LO2"],"day":1,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo2-profiler-opaque","type":"single","prompt":"In a framework profiler table, the data loader appears as one row with no detail inside. Which tool shows where its time goes?","options":[{"key":"A","text":"The same profiler, sorted by total time"},{"key":"B","text":"A roofline estimate"},{"key":"C","text":"A sampling Python profiler such as py-spy, or Scalene"},{"key":"D","text":"A memory profiler"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The loader is Python and image-library code; a Python-level profiler samples those call stacks.","misconceptions":["Re-sorting cannot reveal detail that was never recorded","An estimate does not observe a running program","","Memory tools answer a different question"],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo2-cache-tradeoff","type":"single","prompt":"Caching decoded 64-pixel images made training three times faster. What must be checked before adopting it?","options":[{"key":"A","text":"Nothing: a faster step is always better"},{"key":"B","text":"That the cache file is compressed"},{"key":"C","text":"That the GPU is busy"},{"key":"D","text":"That the augmentation and image quality did not change what the model learns"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The cache changed the augmentation (90-degree rotations); a change that alters inputs must be re-evaluated for accuracy.","misconceptions":["Ignores that speed-ups can change training","Optimises disk space, which was not the question","Checks a resource the laptop does not use",""],"lo":["LO2"],"day":1,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo3-kv","type":"single","prompt":"A model has 24 layers, 8 key-value heads of 128 numbers, and stores its cache in 16 bits. How large is the key-value cache for 2,048 tokens?","options":[{"key":"A","text":"About 50 MB"},{"key":"B","text":"About 200 MB"},{"key":"C","text":"About 400 MB"},{"key":"D","text":"About 800 MB"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"2 x 24 x (8 x 128) x 2,048 x 2 bytes is about 201 MB.","misconceptions":["Forgets the factor 2 for keys and values and the 2 bytes","","Counts 4 bytes per number for a 16-bit cache","Counts query heads too"],"lo":["LO3"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo3-activations-scale","type":"single","prompt":"A training step peaks at 900 MB at batch 128; weights, gradients and optimiser state are 20 MB. What peak do you predict at batch 32?","options":[{"key":"A","text":"About 240 MB"},{"key":"B","text":"About 900 MB"},{"key":"C","text":"About 450 MB"},{"key":"D","text":"About 30 MB"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Activations (about 880 MB) scale with the batch: 880 / 4 + 20 is about 240 MB.","misconceptions":["","Thinks memory does not depend on the batch","Halves instead of quartering","Forgets the activations scale, not vanish"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo3-gap","type":"single","prompt":"Your estimate of saved activations is 20% below what autograd hooks count. Which omission is the likeliest?","options":[{"key":"A","text":"The weights"},{"key":"B","text":"Max pooling's indices, stored as 8-byte integers, and the input batch"},{"key":"C","text":"The optimiser state"},{"key":"D","text":"The loss value"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Pooling keeps the positions of its maxima for the backward pass, as 64-bit integers, and the input is saved by the first layer.","misconceptions":["Weights are not activations","","Optimiser state is not saved by autograd","A single number cannot explain 20%"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo3-checkpointing","type":"single","prompt":"Which part of training memory does activation checkpointing reduce?","options":[{"key":"A","text":"Weights"},{"key":"B","text":"Gradients"},{"key":"C","text":"Activations kept for the backward pass"},{"key":"D","text":"Optimiser state"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"It keeps only some activations and recomputes the rest; parameters, gradients and optimiser state are untouched.","misconceptions":["Thinks checkpointing compresses weights","Thinks it drops gradients","","Thinks it touches the optimiser"],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo4-bf16","type":"single","prompt":"On a processor without native bfloat16 arithmetic, bfloat16 autocast made training slower at equal accuracy. What is the right report?","options":[{"key":"A","text":"Mixed precision does not work"},{"key":"B","text":"The model is too small"},{"key":"C","text":"Accuracy must have dropped"},{"key":"D","text":"On this processor bfloat16 is emulated, so it costs time; on hardware with native support it can be faster"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The speed-up depends on hardware support; the report names the hardware and what was measured.","misconceptions":["Generalises one machine's result to all hardware","Blames model size without evidence","Contradicts the measured accuracy",""],"lo":["LO4"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo4-fp16-underflow","type":"single","prompt":"A fine-tuning run of a small classifier uses float16 autocast on a GPU. The loss is finite and the same as in float32, no gradient is infinite or NaN, and the float32 run of the same batch has no zero gradients. In float16, 7% of the embedding gradients and 2% of all gradients are exactly zero. What should the team change?","options":[{"key":"A","text":"Lower the learning rate, since gradients this large make float16 training unstable"},{"key":"B","text":"Keep the weights and the optimiser state in float16 as well"},{"key":"C","text":"Raise the learning rate so that the small updates show again"},{"key":"D","text":"Scale the loss before backward and unscale the gradients before the step"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Gradients that are zero only in float16, with no inf or NaN, fell below float16's smallest number: underflow. A gradient scaler moves them into float16's range and divides them back before the step.","misconceptions":["Reads underflow as overflow: nothing is infinite and the gradients are too small, not too large","Moves more of the step into float16, so small updates vanish from the weights too","A larger learning rate multiplies zero gradients by more and still gives zero",""],"lo":["LO4"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo4-accumulate","type":"single","prompt":"With gradient accumulation over 4 micro-batches and plain SGD, a participant forgets to divide each loss by 4. What happens?","options":[{"key":"A","text":"Each update is four times too large, as if the learning rate were four times higher"},{"key":"B","text":"Nothing: the optimiser normalises"},{"key":"C","text":"The gradients cancel out"},{"key":"D","text":"Memory use quadruples"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Summed gradients of four un-scaled losses are four times the gradient of the mean loss.","misconceptions":["","Thinks the optimiser rescales gradients by the batch","Confuses summing with cancelling","Memory depends on the micro-batch, not on the loss scale"],"lo":["LO4"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo4-compile","type":"single","prompt":"Compiling a model costs 15 s on the first call and saves 1.5 ms per call. After how many calls in one process is the cost repaid?","options":[{"key":"A","text":"About 100"},{"key":"B","text":"About 1,000"},{"key":"C","text":"About 10,000"},{"key":"D","text":"Never"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"15,000 ms divided by 1.5 ms per call is 10,000 calls.","misconceptions":["Off by two orders of magnitude","Off by one order of magnitude","","Ignores that a steady gain repays a fixed cost eventually"],"lo":["LO4"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo4-fold","type":"single","prompt":"Why can batch norm be folded into the preceding convolution at inference but not during training?","options":[{"key":"A","text":"Folding only works on GPUs"},{"key":"B","text":"At inference it uses fixed stored statistics, so it is a constant affine map"},{"key":"C","text":"Training needs the extra memory"},{"key":"D","text":"Batch norm has no weights at inference"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"In training batch norm uses each batch's statistics, which change every step.","misconceptions":["Folding is arithmetic and works on any device","","Memory is not the reason","Batch norm keeps its scale and shift at inference"],"lo":["LO4"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo5-structured","type":"single","prompt":"Which change makes a convolutional network faster on a standard dense runtime?","options":[{"key":"A","text":"Zeroing half of the weights by magnitude"},{"key":"B","text":"Storing weights as float64"},{"key":"C","text":"Removing half of the filters of each convolution"},{"key":"D","text":"Adding dropout"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Removing filters shrinks every matrix; zeros in a dense matrix are still multiplied.","misconceptions":["Assumes dense kernels skip zeros","More bytes per number only slows the model","","Dropout is inactive at inference"],"lo":["LO5"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo5-calibration","type":"single","prompt":"A static 8-bit model loses 6 points on date palm and almost nothing on tomato. The calibration set was 256 tomato leaves. What is the likeliest cause?","options":[{"key":"A","text":"8 bits are too few for any classifier"},{"key":"B","text":"The model was exported in training mode"},{"key":"C","text":"Date palm leaves are larger"},{"key":"D","text":"Activation ranges learnt from tomato leaves do not fit date-palm leaves"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Calibration sets the integer ranges; an unrepresentative set clips or wastes range for other groups.","misconceptions":["Generalises from one group's loss to all classifiers","Would affect all crops, not one","Leaf size is not what quantisation depends on",""],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo5-parity","type":"single","prompt":"After export, the runtime's logits differ from PyTorch's by up to 3e-6 on 500 leaves, with the same class everywhere. The tolerance stated in advance is 1e-4. What do you conclude?","options":[{"key":"A","text":"Parity holds: the differences are rounding from fused and reordered operations"},{"key":"B","text":"The export is wrong: outputs must be identical"},{"key":"C","text":"The runtime uses a different model"},{"key":"D","text":"Run it on one more leaf to be sure"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Floating-point results agree to rounding, not bit for bit; the stated tolerance is met on many inputs.","misconceptions":["","Expects bit-exact results from a runtime that reorders operations","Different models would disagree far more","One more leaf adds nothing to 500"],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo5-paired","type":"single","prompt":"Two models are compared on the same 2,000 leaves. Why use a paired comparison rather than two separate accuracy intervals?","options":[{"key":"A","text":"It needs fewer leaves to label"},{"key":"B","text":"Each leaf's difficulty cancels out, so the difference is measured more precisely"},{"key":"C","text":"It always shows the new model is better"},{"key":"D","text":"It ignores the leaves both models get right"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Pairing compares the models leaf by leaf; only disagreements carry information about the difference.","misconceptions":["Labelling is the same either way","","A test does not favour either model","Ignoring agreements is a consequence, not the reason"],"lo":["LO5"],"day":4,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo6-percentile","type":"single","prompt":"100 timed calls: mean 7 ms, median 5 ms, 95th percentile 14 ms. Which pair describes the latency a user feels?","options":[{"key":"A","text":"Mean and standard deviation"},{"key":"B","text":"Minimum and maximum"},{"key":"C","text":"Median and 95th percentile"},{"key":"D","text":"Mean and median"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Latency distributions are skewed with a long tail; the median and a tail percentile describe them.","misconceptions":["Assumes a bell curve that latency does not follow","Extremes are dominated by single events","","Both describe the centre only"],"lo":["LO6"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo6-warmup","type":"single","prompt":"A benchmark's first call takes 120 ms and the next 99 average 5 ms. How should the report treat the first call?","options":[{"key":"A","text":"Average it with the others"},{"key":"B","text":"Drop it and never mention it"},{"key":"C","text":"Repeat until the first call is fast"},{"key":"D","text":"Report it separately as the cold start, and exclude it from the steady-state percentiles"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The first call is a different event, paid once; mixing it in hides both numbers.","misconceptions":["Mixes a one-time event into a per-call statistic","Hides a cost the user pays","Cannot change what a cold start is",""],"lo":["LO6"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo6-rerun","type":"single","prompt":"Your neighbour re-runs your benchmark and gets a median 30% higher. Which is the most useful first check?","options":[{"key":"A","text":"Whether their laptop was on battery or under load, and the thread count"},{"key":"B","text":"Whether your code has a bug"},{"key":"C","text":"Whether 30% is within the bootstrap interval"},{"key":"D","text":"Whether they used a newer Python"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Conditions (power mode, load, threads) are the commonest cause of large re-run gaps; the report should record them.","misconceptions":["","Assumes a code error before checking conditions","A within-run interval does not cover a different machine's conditions","A possible factor, but less likely than power and load"],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo6-mix","type":"single","prompt":"Why does the course's benchmark cycle through a saved file of 40 leaves in fixed crop shares?","options":[{"key":"A","text":"To make the benchmark slower"},{"key":"B","text":"So a re-run sees the same inputs, and the inputs resemble the field"},{"key":"C","text":"Because ONNX Runtime needs exactly 40 inputs"},{"key":"D","text":"To test accuracy at the same time"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A fixed, representative input mix makes the benchmark repeatable and relevant.","misconceptions":["Speed of the benchmark is not the goal","","The runtime takes any number of inputs","Accuracy is measured separately, on the held-out set"],"lo":["LO6"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo7-budget","type":"single","prompt":"Budget: p95 at most 15 ms, file at most 1 MB, quality within 1 point. Variant A: 9 ms, 0.3 MB, -2.5 points. Variant B: 13 ms, 0.4 MB, -0.4 points. Variant C: 8 ms, 1.2 MB, -0.1 points. Which meets the budget?","options":[{"key":"A","text":"A"},{"key":"B","text":"B"},{"key":"C","text":"C"},{"key":"D","text":"None"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Only B meets all three lines: A fails quality, C fails size.","misconceptions":["Picks the fastest and ignores quality","","Ignores the size limit","Misreads B's numbers"],"lo":["LO7"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo7-order","type":"single","prompt":"An optimisation log lists: quantisation (-30% p95), batch norm folding (-3%), thread pinning (no effect), input resizing (-55%). How should it be ordered in the report?","options":[{"key":"A","text":"In the order the changes were tried"},{"key":"B","text":"Alphabetically"},{"key":"C","text":"Input resizing, quantisation, folding, thread pinning"},{"key":"D","text":"Without thread pinning, since it did nothing"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Changes are ordered by measured impact, largest first; null results stay in the log.","misconceptions":["Order of trial hides what mattered","Alphabetical order carries no information","","Dropping null results loses evidence"],"lo":["LO7"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo7-energy","type":"single","prompt":"A participant reports '0.04 Wh per 1,000 predictions' with no further detail. What is missing?","options":[{"key":"A","text":"Nothing: it is a measurement"},{"key":"B","text":"The model's accuracy"},{"key":"C","text":"The number of parameters"},{"key":"D","text":"The assumed power draw and the timing it was computed from"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Without a power meter energy is an estimate from time and assumed watts; both must be stated.","misconceptions":["Mistakes an estimate for a measurement","Relevant elsewhere, not to the energy figure","Parameters do not determine energy directly",""],"lo":["LO7"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo7-margin","type":"single","prompt":"A variant meets the 15 ms p95 budget at 14.8 ms on the course laptop. What belongs in the recommendation?","options":[{"key":"A","text":"The margin, and a re-run on a target farm-office laptop before shipping"},{"key":"B","text":"Ship it: it meets the budget"},{"key":"C","text":"Reject it: the margin is too small"},{"key":"D","text":"Lower the budget to 14 ms"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A 0.2 ms margin is within the noise of another machine; the target device has the last word.","misconceptions":["","Treats a small margin on another machine as settled","Rejects a variant that meets every line","Moves the goalposts instead of measuring"],"lo":["LO7"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"}]}</script>
